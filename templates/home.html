<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Performance Prediction</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;
      }

      .container {
        background: white;
        width: 100%;
        max-width: 750px;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        text-align: center;
        color: #1e293b;
        margin-bottom: 10px;
      }

      .description {
        text-align: center;
        color: #64748b;
        margin-bottom: 30px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      label {
        color: #334155;
        font-weight: bold;
        margin-bottom: 8px;
      }

      input,
      select {
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: #3b82f6;
      }

      button {
        width: 100%;
        padding: 14px;
        margin-top: 25px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      .result {
        margin-top: 25px;
        padding: 20px;
        background: #ecfdf5;
        border-radius: 10px;
        text-align: center;
        color: #065f46;
      }

      .result h2 {
        margin-bottom: 10px;
      }

      @media (max-width: 600px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .container {
          padding: 25px 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Student Performance Prediction</h1>

      <p class="description">
        Enter student information to predict the math score.
      </p>

      <form action="/predictdata" method="POST">
        <div class="form-grid">
          <div class="form-group">
            <label>Gender</label>
            <select name="gender" required>
              <option value="">Select Gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>

          <div class="form-group">
            <label>Race / Ethnicity</label>
            <select name="race_ethnicity" required>
              <option value="">Select Group</option>
              <option value="group A">Group A</option>
              <option value="group B">Group B</option>
              <option value="group C">Group C</option>
              <option value="group D">Group D</option>
              <option value="group E">Group E</option>
            </select>
          </div>

          <div class="form-group">
            <label>Parental Level of Education</label>
            <select name="parental_level_of_education" required>
              <option value="">Select Education</option>
              <option value="some high school">Some High School</option>
              <option value="high school">High School</option>
              <option value="some college">Some College</option>
              <option value="associate's degree">Associate's Degree</option>
              <option value="bachelor's degree">Bachelor's Degree</option>
              <option value="master's degree">Master's Degree</option>
            </select>
          </div>

          <div class="form-group">
            <label>Lunch</label>
            <select name="lunch" required>
              <option value="">Select Lunch Type</option>
              <option value="standard">Standard</option>
              <option value="free/reduced">Free / Reduced</option>
            </select>
          </div>

          <div class="form-group">
            <label>Test Preparation Course</label>
            <select name="test_preparation_course" required>
              <option value="">Select Status</option>
              <option value="completed">Completed</option>
              <option value="none">None</option>
            </select>
          </div>

          <div class="form-group">
            <label>Reading Score</label>
            <input
              type="number"
              name="reading_score"
              min="0"
              max="100"
              placeholder="Enter reading score"
              required
            />
          </div>

          <div class="form-group">
            <label>Writing Score</label>
            <input
              type="number"
              name="writing_score"
              min="0"
              max="100"
              placeholder="Enter writing score"
              required
            />
          </div>
        </div>

        <button type="submit">Predict Math Score</button>
      </form>

      {% if results is not none %}
      <div class="result">
        <h2>Prediction Result</h2>
        <h1>{{ results }}</h1>
        <p>Predicted Math Score</p>
      </div>
      {% endif %}
    </div>
  </body>
</html>
